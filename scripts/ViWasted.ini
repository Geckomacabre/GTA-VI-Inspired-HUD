; WASTED and BUSTED screens, from the FiveM version (vi_wasted, GPL-3.0).
; The game still takes you to the hospital or the police station afterwards;
; these replace only the screen in between.

[Wasted]
Enabled = True
Word = wasted
Colour = 220,40,40
DurationMs = 4000

[Busted]
Enabled = True
Word = busted
Colour = 70,140,230
DurationMs = 6000
; SPACE or ENTER ends it early.
Skippable = True

[Screen]
; The red laid over the whole picture (r, g, b, a).
Wash = 160,20,20,70
TimeScale = 0.15
; Missions have their own failure screens; leave them to the game.
SkipInMissions = True
; Keys that play the screens for trying them out. None for none.
TestWastedKey = None
TestBustedKey = None
