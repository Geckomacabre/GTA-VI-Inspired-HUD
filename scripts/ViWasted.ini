; WASTED and BUSTED screens, from the FiveM version (vi_wasted, GPL-3.0).
; The game still takes you to the hospital or the police station afterwards;
; these replace only the screen in between.

[Wasted]
Enabled = True
Word = wasted
; GTA VI's light grey (the red wash doesn't touch the word). 255,255,255 is white.
Colour = 154,152,153
DurationMs = 4000
; GTA VI's ending: the picture goes to black under the word, the word turns red
; on the black, then fades. False: the whole screen fades out together.
RedFadeOut = True

[Busted]
Enabled = True
Word = busted
Colour = 70,140,230
DurationMs = 6000
; SPACE or ENTER ends it early.
Skippable = True

[Screen]
; The red laid over the whole picture (r, g, b, a): GTA VI's dark red-brown. The
; FiveM version's lighter red was 160,20,20,70.
Wash = 60,8,0,140
TimeScale = 0.15
; How wide the word is, as a share of a 16:9 screen's width (GTA VI's: 0.344).
; Other screen shapes get the same size. 0: the FiveM version's smaller word.
WordWidth = 0.344
; The FiveM version's drop shadow and dark edge round the word. GTA VI's word is
; flat, without either.
Outline = False
; GTA VI's picture round the word: dark edges (0 to 1; 0 for none), a slight
; wide-lens bend, and the body in focus with the rest soft.
Vignette = 0.85
LensDistortion = True
DepthOfField = True
; gtavi: a low shot near the body, as GTA VI's. fivem: the FiveM version's,
; from behind, rising. In a vehicle both frame the vehicle.
Camera = gtavi
; Missions have their own failure screens; leave them to the game.
SkipInMissions = True
; Keys that play the screens for trying them out. None for none.
TestWastedKey = None
TestBustedKey = None
