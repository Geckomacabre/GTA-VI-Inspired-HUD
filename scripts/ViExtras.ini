; GTA VI-Inspired HUD 2.5 additions: single-player ports of the FiveM version's
; features. Delete a section's Enabled line or set it to False to turn one off.
; Times are REAL milliseconds unless they say otherwise: the cinematics run in
; slow motion, which stretches the game's own clock.

[CrashCam]
; Crash hard enough and the game cuts to a camera at the roadside, in slow
; motion, then back to your own view. Switch it on and off with CRASH CAMERA in
; the HUD's settings menu (hold the camera button, V), which is saved as
; GTA6Hud.ini [Cinematics] CrashCamera. That setting used to run GTA6Hud's own
; crash camera, which no longer runs. False here turns this one off for good.
Enabled = True
; A crash is speed lost in almost no time: going at least MinSpeed km/h, and
; losing MinSpeedLoss km/h inside one SampleMs. Braking never does that.
MinSpeed = 80
MinSpeedLoss = 45
SampleMs = 100
DriverOnly = True
CooldownMs = 20000
; Missions run their own cameras; leave them alone.
SkipInMissions = True
; The shot: the hit slowed from your seat, the cut away, the cut back.
TimeScale = 0.2
ImpactHoldMs = 350
DurationMs = 3400
EaseOutMs = 450
HudReturnMs = 800
BlackFlashMs = 0
FadeInMs = 0
; The edges of the screen closed in, breathing slowly (OverlayPulse), and thin
; bars top and bottom that hold still.
Overlay = True
OverlayStrength = 1
OverlayBars = 0.032
OverlayPulse = True
HandShake = 0.25
; Where the camera can stand: metres ahead along the way the car was going,
; to the side, above the ground, and its field of view.
Shot1Ahead = 6
Shot1Side = 15
Shot1Height = 0.6
Shot1Fov = 40
Shot2Ahead = 16
Shot2Side = 7
Shot2Height = 0.9
Shot2Fov = 36
Shot3Ahead = 4
Shot3Side = 19
Shot3Height = 7.5
Shot3Fov = 42
