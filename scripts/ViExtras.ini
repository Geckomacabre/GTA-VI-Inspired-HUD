[PoliceForce]
; Police only shoot to kill when you're armed (a gun in your hand, or one fired in
; the last ArmedGraceSeconds) and wanted at LethalFromStars stars or more. Otherwise
; they carry stun guns: a hit puts your weapon away and they arrest you (BUSTED).
Enabled = True
LethalFromStars = 3
ArmedGraceSeconds = 5
; You're arrested (BUSTED) when a stun gun drops you, or when you stand still,
; unarmed, near a cop at 1-2 stars: you drop to 1 star and the nearest cop arrests
; you. Draw a gun, or no arrest for this long, and your stars come back.
ArrestWindowSeconds = 15

