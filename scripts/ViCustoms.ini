; Leonida Customs, the FiveM version's mod shop (Lenonida_customs, after
; renzu_customs by Renzuzu, GPL-3.0; see ViCustoms\LICENSE.txt), at the five Los
; Santos Customs in place of GTA6Hud's own shop. Drive in and stop: it opens.
; GTA6Hud.ini [Customs] stays on: GTA6Hud still opens the garage doors and
; keeps GTA's own shop shut, only its menu is kept from opening.

[Customs]
Enabled = True
; The gen9 chameleon paints need the carcols Leonida Customs streams in
; FiveM, which single player has not got. True only with a mod that adds them.
ChameleonPaints = False
; How close (m) to a shop's upgrade spot the car has to stop (anywhere inside
; the garage counts too).
SpotRadius = 7
