; Crouch and crawl. The script is ported from the FiveM server's emotes (um_emotes,
; an rpemotes fork, GPL-3.0; rpemotes' crouch and crawl by Mads; see
; ViCrouch\LICENSE.txt). The animations are Rockstar's own, from GTA V. Keys are
; System.Windows.Forms key names (LControlKey, RControlKey, C, X ...); None
; turns that one off.

[Crouch]
Enabled = True
Key = LControlKey
; Left Ctrl is GTA's stealth key as well: the first tap is stealth, a second
; one inside a second crouches, as on the server. True crouches on the first.
OverrideStealthMode = False
; No shooting while crouched (the server's FpsMode).
FpsMode = False

[Crawl]
; Lie down (a dive when running); W / S crawl, A / D turn, Space rolls over,
; the key again gets up.
Enabled = True
Key = RControlKey
