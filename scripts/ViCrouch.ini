; Crouch and crawl. The script is ported from the FiveM server's emotes (um_emotes,
; an rpemotes fork, GPL-3.0; rpemotes' crouch and crawl by Mads; see
; ViCrouch\LICENSE.txt). The animations are Rockstar's own, from GTA V; the front
; crawl's leg motion is reworked from Rockstar's crawl for this mod. Keys are
; System.Windows.Forms key names (LControlKey, RControlKey, C, X ...); None
; turns that one off.

[Crouch]
Enabled = True
Key = LControlKey
; Left Ctrl is GTA's stealth key as well: the first tap is stealth, a second
; one inside a second crouches, as on the server. True crouches on the first.
OverrideStealthMode = False
; No shooting while crouched (the server's FpsMode).
FpsMode = False

[Crawl]
; Lie down (a dive when running); W / S crawl, A / D turn, Space rolls over,
; the key again gets up.
Enabled = True
Key = RControlKey
; True: on your front, each knee draws up along the ground as the opposite arm
; reaches, then pushes (our own clips, in the vihudanims pack). False: Rockstar's
; crawl, with the legs dragging.
OwnClips = True
; True: while crawling, the ped's collision follows the lying body, to keep it out of
; slopes, steps and walls. False: GTA's upright capsule (the body can sink into slopes).
BodyCapsule = True
