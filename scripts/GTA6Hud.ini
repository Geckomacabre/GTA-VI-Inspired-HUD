; ============================================================================
;  GTA VI-Inspired HUD - GTA6Hud.ini (FBICat's HUD)
; ============================================================================
;
;  TURNING THINGS ON AND OFF
;  The switches most people change are right below, in groups.
;    True  = on
;    False = off
;  Change only the word after the "=", save, and restart the game.
;  (The [Name] line above each switch must stay where it is.)
;
;  You don't need anything below the ADVANCED line. It's there for people
;  who want to change sizes, colours, amounts or timings.
;
;  The fork's extras (the crosshair, honor, witnesses, the radio wheel, the
;  stun-gun arrests and more) have their own switches in ViExtras.ini.
; ============================================================================

; ---- On screen ---------------------------------------------------------------
[Settings]
; The status bars at the top left.
StatusBars = True
; Markers on things you can interact with.
InteractMarkers = True

[Notifications]
; Notifications in GTA VI's style.
Enabled = True

[VehicleCard]
; The vehicle card (engine, fuel) while you drive.
Enabled = True

[Location]
; The street and area name.
Enabled = True

[HelpText]
; GTA's help boxes in GTA VI's style.
Enabled = True

[CashPopups]
; A + or - popup when your money changes.
Enabled = True

[ShopSigns]
; Shop signs over the shops in the world.
Enabled = True

[PauseMenu]
; GTA VI's pause menu.
Enabled = True

[GunInfo]
; A box with your gun's details.
Enabled = False

[Reticle]
; FBICat's aim reticle (the HUD's crosshair in ViExtras.ini replaces it).
Enabled = False

[Hitmarkers]
; FBICat's hit markers (the crosshair's kill marks in ViExtras.ini replace them).
Enabled = False

; ---- Cameras -----------------------------------------------------------------
[Cinematics]
; A slow-motion camera on some kills.
KillCamera = False

; ---- Police ------------------------------------------------------------------
[Police]
; Smarter police: they take cover, flank and shout orders.
SmartAiEnabled = True
; Police remember your face, outfit or car and come after you again later.
MemoryEnabled = False

[Heat]
; Police patrols cruise near you while there's a bounty on you.
Enabled = True

[Bounty]
; A bounty builds up on you for kills and stolen cars.
Enabled = True

[Wanted]
; A sixth star, which brings in the military.
SixStarEnabled = True

; ---- Life on the streets -----------------------------------------------------
[World]
; Things happen around you: chases, muggings, drive-bys, road rage.
Enabled = True
; Police chasing other people.
PoliceChases = True
; People getting mugged.
Muggings = True
; Gang drive-bys.
DriveBys = True
; Drivers losing their temper.
RoadRage = True

[Interactions]
; FBICat's stranger talk (hold aim on someone). Leave False while Greet / Antagonize is on.
NpcConversations = False

; ---- Weapons -----------------------------------------------------------------
[Wheel]
; Carry every weapon, as in GTA V. False: 2 pistols, 2 long guns, 1 thrown, 1 other.
AllWeapons = True

[WeaponsOnBack]
; Guns you're not holding show on your back.
Enabled = False

; ---- Driving -----------------------------------------------------------------
[Driving]
; FBICat's driving changes: handling, crashes, cars that don't flip.
Enabled = True
; Cars spin out in crashes (SPIN-OUTS in HUD OPTIONS).
SpinOuts = True

[FuelStation]
; Cars use fuel and need filling up at gas stations.
BurnFuel = True

[Dealership]
; Buy or rent cars at the dealership.
Enabled = True

[Trunk]
; Store things in your car's trunk.
Enabled = True

; ---- Things to do ------------------------------------------------------------
[Needs]
; Hunger and thirst.
Enabled = False

[Consumables]
; Food, drinks and items you carry and use.
Enabled = True

[Fence]
; Sell stolen goods to the fence.
Enabled = True

[Activities]
; Activities: base jumping, scuba diving, watercraft.
Enabled = True

[Basketball]
; Basketball courts you can play on.
Enabled = True

[Weather]
; FBICat's weather: a storm now and then, colour grading and wind.
Enabled = True

[DayLength]
; A longer day: a game minute lasts 6 seconds instead of 2.
Enabled = True

; ---- Characters --------------------------------------------------------------
[Swap]
; Switch characters with the character wheel (hold Left Alt).
Enabled = True

[Lucia]
; Keep Lucia on the wheel even without her model (she switches on by herself when her model is in the game).
Enabled = False

[Jason]
; Jason on the wheel when his model is in the game.
Enabled = True

